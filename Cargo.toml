[package]
name = "nu_plugin_dns"
version = "4.0.13-alpha.1"
authors = ["Skyler Hawthorne <skyler@dead10ck.dev>"]
description = "A DNS utility for nushell"

repository = "https://github.com/dead10ck/nu_plugin_dns"
edition = "2024"
license = "MPL-2.0"
readme = "README.md"
keywords = ["dns", "dig", "nu", "nushell", "plugin"]
categories = ["command-line-utilities"]
exclude = [ ".github/" ]

[[bin]]
name = "nu_plugin_dns"
bench = false

[lib]
bench = false

[profile.release]
codegen-units = 1
lto = "thin"

[dependencies]
chrono = { version = "0.4", features = [ "std" ], default-features = false }
futures-util = "0.3.34"
nu-plugin = "0.115.1"
nu-protocol = "0.115.1"

tokio = "1.53.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [ "env-filter" ] }

rustls = "0.23.43"
webpki-roots = "1.0.9"
tokio-util = { version = "0.7.19", features = ["rt"] }
rmp-serde = "1.3.1"
serde = "1.0.228"

[dependencies.hickory-proto]
version = "0.26.1"
features = [
  "dnssec-ring",
]

[dependencies.hickory-resolver]
version = "0.26.1"
features = [
  "dnssec-ring",
  "tls-ring",
  "https-ring",
  "quic-ring",
  "h3-ring",
  "serde",
]

[dependencies.hickory-net]
version = "0.26.1"
features = [
  "dnssec-ring",
  "tls-ring",
  "https-ring",
  "quic-ring",
  "h3-ring",
]

[dev-dependencies]
nu-plugin-test-support = "0.115.1"
nu-command = { version = "0.115.1", features = ["plugin"] }

# [NOTE] the feature resolution comes out very strangely here by default
#
# * `nu-plugin-core` gets pulled in via the regular dependencies with its
#   default features, which in turn activates the `local-socket` feature
# * `nu-command` transitively pulls in `nu-plugin-engine` from the root
#   workspace, which deactivates its default features, including `local-socket`
# * `nu-plugin-engine` itself depends on `nu-plugin-core`, and has its own
#   corresponding `local-socket` feature to handle the one from `nu-plugin-core`
#
# so we end up with `nu-plugin-core` *with* the `local-socket` feature, but
# `nu-plugin-engine` *without* the `local-socket` feature, which leads to a
# compile error due to a missing enum variant
#
# work around this by explicitly pulling in `nu-plugin-engine` with the
# `local-socket` feature
nu-plugin-engine = { version = "0.115.1", features = ["local-socket"] }

tokio = { version = "1.53.1", features = ["fs"] }

[dev-dependencies.hickory-server]
version = "0.26.1"
features = [
  "dnssec-ring",
  "tls-ring",
  "https-ring",
  "quic-ring",
  "h3-ring",
]
