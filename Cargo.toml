[package]
name = "nu_plugin_dns"
version = "4.0.15-alpha.1"
authors = ["Skyler Hawthorne <skyler@dead10ck.dev>"]
description = "A DNS utility for nushell"

repository = "https://github.com/dead10ck/nu_plugin_dns"
edition = "2024"
license = "MPL-2.0"
readme = "README.md"
keywords = ["dns", "dig", "nu", "nushell", "plugin"]
categories = ["command-line-utilities"]
exclude = [ ".github/" ]

[[bin]]
name = "nu_plugin_dns"
bench = false

[lib]
bench = false

[profile.release]
codegen-units = 1
lto = "thin"

[dependencies]
chrono = { version = "0.4", features = [ "std" ], default-features = false }
futures-util = "0.3.34"
nu-plugin = "0.117.0"
nu-protocol = "0.117.0"

tokio = "1.54.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = [ "env-filter" ] }

rustls = "0.23.46"
webpki-roots = "1.0.12"
tokio-util = { version = "0.7.20", features = ["rt"] }
rmp-serde = "1.3.1"
serde = "1.0.228"

[dependencies.hickory-proto]
version = "0.26.1"
features = [
  "dnssec-ring",
]

[dependencies.hickory-resolver]
version = "0.26.1"
features = [
  "dnssec-ring",
  "tls-ring",
  "https-ring",
  "quic-ring",
  "h3-ring",
  "serde",
]

[dependencies.hickory-net]
version = "0.26.1"
features = [
  "dnssec-ring",
  "tls-ring",
  "https-ring",
  "quic-ring",
  "h3-ring",
]

[dev-dependencies]
# [NOTE] See: https://github.com/nushell/nushell/blob/651f0e4e3e79ab1869fb379a9db98c09c513c848/Cargo.toml#L209-L213
notify = "=9.0.0-rc.4"
nu-plugin-test-support = "0.117.0"
tokio = { version = "1.54.1", features = ["fs"] }

[dev-dependencies.nu-command]
version = "0.117.0"
default-features = false
features = ["plugin"]

[dev-dependencies.hickory-server]
version = "0.26.1"
features = [
  "dnssec-ring",
  "tls-ring",
  "https-ring",
  "quic-ring",
  "h3-ring",
]
